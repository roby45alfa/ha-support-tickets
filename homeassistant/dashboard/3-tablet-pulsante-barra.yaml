# Pulsante "Assistenza" per una barra di navigazione Mushroom.
# Il badge mostra il numero di richieste aperte (blu) o in coda (arancione).
# Cambia navigation_path con il percorso della tua vista.
# Se la barra è un horizontal-stack, dai a TUTTI i pulsanti la stessa larghezza,
# altrimenti il più largo esce dal bordo.
type: custom:mushroom-template-card
primary: Assistenza
icon: mdi:message-alert-outline
layout: horizontal
badge_icon: >
  {% set n = states('sensor.richieste_assistenza') | int(0)
     + states('todo.segnalazioni_in_attesa') | int(0) %}
  {% if n > 9 %}
    mdi:numeric-9-plus
  {% elif n > 0 %}
    mdi:numeric-{{ n }}
  {% endif %}
badge_color: >
  {% if states('todo.segnalazioni_in_attesa') | int(0) > 0 %}
    orange
  {% else %}
    blue
  {% endif %}
tap_action:
  action: navigate
  navigation_path: /NOME-DASHBOARD/assistenza
card_mod:
  style: |
    ha-card {
      width: 150px;
      height: 54px;
      border-radius: 28px;
      background: rgba(20,20,20,0.75);
      border: none;
    }
